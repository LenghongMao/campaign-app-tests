name: Playwright Tests
on:
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]
  repository_dispatch:
    types: [run-playwright]
  schedule:
    # Runs at 3:55 AM UTC, which is 10:55 AM in Cambodia (UTC+7)
    - cron: '55 3 * * *'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
    - name: Run Playwright tests
      run: |
        if [ "${{ github.event.client_payload.grep_tag }}" != "" ]; then
          echo "Running specific tests for tag: ${{ github.event.client_payload.grep_tag }}"
          npx playwright test --grep "${{ github.event.client_payload.grep_tag }}"
        else
          echo "Running ALL tests"
          npx playwright test
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: final-screenshot
        path: screenshots/
        retention-days: 30

    #  SUCCESS NOTIFICATION
    - name: Slack Notification (Pass)
      if: success()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"✅ *Playwright Tests Passed!* 🎉\n*Scope Verified:* ${{ github.event.client_payload.scope_msg || 'Full Suite (Triggered Directly)' }}\n*View Screenshots:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}

    #  FAILURE NOTIFICATION
    - name: Slack Notification (Fail)
      if: failure()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"❌ *Playwright Tests Failed!* 🚨\n*Scope Attempted:* ${{ github.event.client_payload.scope_msg || 'Full Suite (Triggered Directly)' }}\nSomething broke during the E2E run.\n*View Error Report & Screenshots:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}


    #  EMAIL SUCCESS NOTIFICATION
    - name: Email Notification (Pass)
      if: success()
      uses: dawidd6/action-send-mail@v4
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "✅ Playwright Passed: ${{ github.repository }}"
        to: maolenghong@yahoo.com  # 👈 Make sure to put the correct destination email here
        from: Playwright CI Bot <${{ secrets.SMTP_USER }}>
        body: |
          Playwright E2E tests have finished successfully!
          
          Scope Verified: ${{ github.event.client_payload.scope_msg || 'Full Suite (Scheduled / Direct Run)' }}
          Run Logs & Artifacts: https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}

    #  EMAIL FAILURE NOTIFICATION
    - name: Email Notification (Fail)
      if: failure()
      uses: dawidd6/action-send-mail@v4
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "🚨 ALERT: Playwright Failed on ${{ github.repository }}"
        to: maolenghong@yahoo.com  # 👈 Make sure to put the correct destination email here
        from: Playwright CI Bot <${{ secrets.SMTP_USER }}>
        body: |
          Attention! The Playwright E2E Test Suite has encountered errors.
          
          Scope Attempted: ${{ github.event.client_payload.scope_msg || 'Full Suite (Scheduled / Direct Run)' }}
          Triggered By Event: ${{ github.event_name }}
          
          You can inspect the execution log, trace viewer assets, and test screenshots directly on GitHub:
          https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}

