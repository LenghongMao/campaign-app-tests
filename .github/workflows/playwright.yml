name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  repository_dispatch:
    types: [run-playwright]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
    - name: Run Playwright tests
      run: |
        if [ "${{ github.event.client_payload.grep_tag }}" != "" ]; then
          echo "Running specific tests for tag: ${{ github.event.client_payload.grep_tag }}"
          npx playwright test --grep "${{ github.event.client_payload.grep_tag }}"
        else
          echo "Running ALL tests"
          npx playwright test
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: final-screenshot
        path: screenshots/
        retention-days: 30

    #  ADD THIS: Translate the tag into readable text
    - name: Set Test Scope Variable
      if: always()
      run: |
        TAG="${{ github.event.client_payload.grep_tag }}"
        if [ "$TAG" == "@index" ]; then
          echo "TEST_SCOPE=Campaign List (@index)" >> $GITHUB_ENV
        elif [ "$TAG" == "@detail" ]; then
          echo "TEST_SCOPE=Campaign Detail (@detail)" >> $GITHUB_ENV
        else
          echo "TEST_SCOPE=All Tests (Full Suite)" >> $GITHUB_ENV
        fi

    #  SUCCESS NOTIFICATION (Updated)
    - name: Slack Notification (Pass)
      if: success()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"✅ *Playwright Tests Passed!* 🎉\n*Scope Verified:* ${{ env.TEST_SCOPE }}\n*View Screenshots:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}

    #  FAILURE NOTIFICATION (Updated)
    - name: Slack Notification (Fail)
      if: failure()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"❌ *Playwright Tests Failed!* 🚨\n*Scope Attempted:* ${{ env.TEST_SCOPE }}\nSomething broke during the E2E run.\n*View Error Report & Screenshots:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
